{% extends "base.html" %}
{% block content %}
{# One 404 file serves the whole site, so it says it in every language. #}
<article class="prose narrow notfound">
  {% for l in languages %}
  <section lang="{{ l.key }}">
    <h1>{{ l.strings.notfound_title }}</h1>
    <p>{{ l.strings.notfound_body }} <a href="{{ l.home }}">{{ l.strings.notfound_link }}</a>.</p>
  </section>
  {% endfor %}
</article>
{% endblock %}
