# Site-wide settings. Everything the build needs that is not content.
title: ohlala.cloud
url: https://ohlala.cloud
# The tagline, the description and every other word that changes with the
# language live in languages.yaml.
author:
  name: Etienne
  url: https://ohlala.cloud/about/

# Feedback / "what next" form. Create a form on tally.so and paste its id.
# Leave empty to hide the feedback block.
tally_form_id: ""

# Google Search Console ownership token. Normally empty: the site is verified
# by a DNS record in the Route 53 zone, nothing is needed here. Fill it only if
# verification has to be done through the page instead ("HTML tag" method in
# Search Console; the token or the whole <meta> tag both work). Once filled, it
# has to stay: removing it un-verifies the site. See the README.
google_site_verification: ""

# Google AdSense publisher id (ca-pub-XXXXXXXXXXXXXXXX). Empty = no ad script.
# Turn on "Privacy & messaging" in the AdSense console for the EU consent
# banner; it is served by the same script, nothing else to add here.
adsense_client: ""

# Colours used for generated Open Graph images (one per game, keyed by slug).
og_colors:
  default: "#1f2937"
  desktop-tycoon: "#0f766e"
  pigeon-in-paris: "#7c2d5e"
  aisle-be-back: "#b91c1c"
