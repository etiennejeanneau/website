# Site-wide settings. Everything the build needs that is not content.
title: ohlala.cloud
url: https://ohlala.cloud
# The tagline, the description and every other word that changes with the
# language live in languages.yaml.
author:
  name: Etienne
  url: https://ohlala.cloud/about/

# Feedback form. Create a form on tally.so, then paste here either its id
# (the last part of its address, like wkKqJb) or the whole address. A button to
# it then appears at the bottom of every page, and Tally emails you each
# answer. Empty = no button anywhere, which is the state the site ships in.
# The form needs two hidden fields named exactly "Page" and "Lang"; each answer
# then says which page it was sent from and in which language. See the README.
tally_form_id: "https://tally.so/r/b5aNoo"

# Google Search Console ownership token. Normally empty: the site is verified
# by a DNS record in the Route 53 zone, nothing is needed here. Fill it only if
# verification has to be done through the page instead ("HTML tag" method in
# Search Console; the token or the whole <meta> tag both work). Once filled, it
# has to stay: removing it un-verifies the site. See the README.
google_site_verification: ""

# Google AdSense publisher id (ca-pub-XXXXXXXXXXXXXXXX). Empty = no ad script.
# Turn on "Privacy & messaging" in the AdSense console for the EU consent
# banner; it is served by the same script, nothing else to add here.
adsense_client: ""

# Colours used for generated Open Graph images (one per game, keyed by slug).
og_colors:
  default: "#1f2937"
  desktop-tycoon: "#0f766e"
  pigeon-in-paris: "#7c2d5e"
  aisle-be-back: "#b91c1c"
  every-drop-counts: "#0369a1"
  whack-a-president: "#166534"
  arrr-you-lost: "#0f3f62"
  waza-kotoba: "#2b4570"
  le-lion-et-le-rat: "#3b2a1a"

# Where each game keeps the player's best score, so the share button in the
# corner of the game can say it (templates/share.html). Every game stores it
# in the browser itself; this only says under which name.
#   key    the name the game uses in the browser's local storage
#   field  when the game keeps several things together, the one that counts
#   unit   the word that goes after the number, in the game's own English
# A game missing from this list is not a mistake: its button shares the game
# without a score, and its own Share score button still works as it always did.
scores:
  aisle-be-back:     { key: trolley.best }
  every-drop-counts: { key: everydrop.best, unit: litres }
  pigeon-in-paris:   { key: pigeonOfParis.v1, field: best, unit: crumbs }
  whack-a-president: { key: wap_best, unit: presidents }
  desktop-tycoon:    { key: dt.save.v3, field: earned, unit: MB freed }
  arrr-you-lost:     { key: arrryoulost.v3, field: gold, unit: gold }
