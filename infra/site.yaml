AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ohlala.cloud static site: private S3 bucket behind CloudFront (OAC), ACM
  certificate, Route 53 records, CloudFront standard logs to S3, and an IAM role
  that GitHub Actions assumes through OIDC to deploy. Deploy this stack in
  us-east-1 (the ACM certificate for CloudFront must live there).

Parameters:
  DomainName:
    Type: String
    Default: ohlala.cloud
  BucketPrefix:
    Type: String
    Default: ohlala-cloud
    AllowedPattern: "[a-z0-9][a-z0-9-]{1,40}[a-z0-9]"
    Description: >-
      Prefix for the two bucket names. Must not contain dots: CloudFront reaches
      the bucket over HTTPS and the S3 wildcard certificate does not cover names
      with extra dots, which would make every page return 502. Change this if S3
      says the name is already taken (bucket names are globally unique).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone for DomainName
  GitHubRepo:
    Type: String
    Default: etiennejeanneau/website
    Description: owner/repo allowed to deploy (production environment only)
  GitHubOwnerId:
    Type: String
    Default: "21365848"
    AllowedPattern: "[0-9]+"
    Description: >-
      Numeric id of the GitHub account that owns the repo. GitHub puts it in the
      OIDC token next to the name and it never changes, even if the account is
      renamed. Find it at https://api.github.com/users/<owner>
  GitHubRepoId:
    Type: String
    Default: "1375690421"
    AllowedPattern: "[0-9]+"
    Description: >-
      Numeric id of the repo itself, same idea.
      Find it at https://api.github.com/repos/<owner>/<repo>
  LogRetentionDays:
    Type: Number
    Default: 400
    Description: How long to keep CloudFront access logs (visitor stats source)
  StatsEmail:
    Type: String
    Default: ""
    Description: >-
      Where the weekly visitor stats are emailed (.github/workflows/stats.yml).
      Leave empty for no email: the SES address and the stats role are then not
      created. Setting it makes AWS send a confirmation link to that address;
      nothing is sent until it is clicked.

Conditions:
  HasStatsEmail: !Not [!Equals [!Ref StatsEmail, ""]]

Resources:
  # ------------------------------------------------------------ storage
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketPrefix}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketPrefix}-logs"
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------ tls + dns
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed zone id
  ApexRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ------------------------------------------------------------ cdn
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Rewrites /games/x/ -> /games/x/index.html (S3 REST origins have no
  # directory index) and redirects www -> apex so there is one canonical host.
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-request"
      AutoPublish: true
      FunctionConfig:
        Runtime: cloudfront-js-2.0
        Comment: directory index + www redirect
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host && req.headers.host.value;
          if (host === 'www.${DomainName}') {
            return { statusCode: 301, statusDescription: 'Moved Permanently',
                     headers: { location: { value: 'https://${DomainName}' + req.uri } } };
          }
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          else if (!req.uri.includes('.')) req.uri += '/index.html';
          return req;
        }

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          # No X-Frame-Options: the story pages embed the games in an iframe.

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases: [!Ref DomainName, !Sub "www.${DomainName}"]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false

  # ------------------------------------------------------------ deploy identity
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]   # ignored by AWS for GitHub since 2023, still required by the API

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-deploy"
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # One exact subject, no wildcards anywhere. The deploy job declares
              # environment: production, so GitHub puts the environment in the sub
              # claim instead of the branch. Repositories created after 15 July 2026
              # also get the immutable owner and repository ids next to the names,
              # which is the form this repository sends:
              #   repo:owner@21365848/name@1375690421:environment:production
              # Pinning the ids rather than wildcarding them is the whole point of
              # having them: if the account name were ever released and someone else
              # took it, a repository of theirs with the same name would not match.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:environment:production"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------ weekly stats email
  # SES sends the email. While the account is in the SES "sandbox" (the default,
  # and the right place to stay), it can only send to confirmed addresses, so
  # this one address is both the sender and the only possible recipient.
  StatsEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasStatsEmail
    Properties:
      EmailIdentity: !Ref StatsEmail

  # A second role, apart from the deploy one: it reads the logs and sends one
  # email, and can do nothing else. Same trust as the deploy role, except the
  # job must declare environment: stats instead of production, so neither job
  # can borrow the other's rights.
  StatsRole:
    Type: AWS::IAM::Role
    Condition: HasStatsEmail
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-stats"
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:environment:stats"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: read-logs-send-report
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt LogBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${LogBucket.Arn}/cloudfront/*"
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${StatsEmail}"
                Condition:
                  ForAllValues:StringEquals:
                    ses:Recipients: [!Ref StatsEmail]

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable in GitHub
  LogBucketName:
    Value: !Ref LogBucket
    Description: Source for scripts/stats.py
  StatsRoleArn:
    Condition: HasStatsEmail
    Value: !GetAtt StatsRole.Arn
    Description: Set this as the AWS_STATS_ROLE_ARN secret of the stats environment in GitHub
