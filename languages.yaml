# Every word on the site that is not part of a page. One block per language.
#
# The key ("en", "fr") is the folder under content/ and the URL prefix: the
# default language sits at the root (/games/pigeon-in-paris/), the others under
# their key (/fr/games/pigeon-in-paris/). Adding a language means adding a
# block here and a folder content/<key>/ with the pages in it.

default: en

en:
  name: English          # shown in the language menu
  short: EN              # shown on narrow screens
  tagline: Silly little games, vibe coded in the evening.
  description: >-
    Free browser games for your phone, made by describing them to an AI and
    playing the result. Every game comes with the story of its prompts.
  hero: >-
    Free games for your phone. Each one was built by describing it to an AI,
    playing the result, and complaining until it was fun. No accounts, no
    downloads, nothing stored but your best score.
  hero_link: How it works →
  nav_games: Games
  nav_about: About
  language_menu: Language
  games_heading: Games
  play: Play
  play_title: Play {title}
  shot_alt: "{title} running on a phone"
  iterations: iterations
  prompts: prompts
  story_link: Read how it was made →
  story_headline: How {title} was made
  # Animations: short stories to watch and listen to, in their own section of
  # the home page, under the games. Each paragraph of the intro is one item.
  nav_animations: Animations
  animations_heading: Animations
  animations_intro:
    - >-
      No score and no game over here. These are little animated stories, to
      watch and to listen to, born the same way as the games: an idea one
      evening, a conversation with Claude, and a lot of back and forth about
      what I see on the screen, never about the code.
    - >-
      It is also a testing ground: drawing styles I had never tried, voices
      generated by AI, sound effects made from scratch. Everything you see and
      hear is free to use or generated, and every source is credited.
  watch: Watch
  watch_title: Watch {title}
  fullscreen: Full screen
  watch_hint: >-
    Sound on: the story is told out loud. On a phone, it is bigger with the
    phone turned sideways.
  runtime: "{m} min {s} s"
  animation_story_link: Read how it was made →
  # The share button the build adds to every game (templates/share.html).
  # {title} is the game's name, {score} the number the game kept, with its
  # word after it when site.yaml gives one ("42 crumbs").
  share_button: Share
  share_score: Share score
  share_best: "My best at {title}: {score}."
  share_invite: "Come play {title} on ohlala.cloud."
  share_copied: Copied!
  play_hint: >-
    Best on a phone, portrait. Opens full screen; use your browser's back
    button to return.
  feedback_heading: Did it make you smile, or swear?
  feedback_body: >-
    Say so. It takes ten seconds, no email address needed, and it lands
    straight in my inbox.
  feedback_button: Leave feedback
  more_heading: More games
  made_by: Made by
  with_claude: with a lot of help from Claude.
  rss: RSS
  privacy: Privacy
  notfound_title: Clean-up on aisle 404
  notfound_body: "That page isn't here. The games are, though:"
  notfound_link: back to the list

fr:
  name: Français
  short: FR
  tagline: De petits jeux idiots, vibe codés le soir.
  description: >-
    Des jeux gratuits pour votre téléphone, faits en les décrivant à une IA
    puis en jouant au résultat. Chaque jeu est publié avec l'histoire de ses
    prompts.
  hero: >-
    Des jeux gratuits pour votre téléphone. Chacun a été fabriqué en le
    décrivant à une IA, en jouant au résultat, et en râlant jusqu'à ce que ce
    soit amusant. Pas de compte, pas de téléchargement, rien de stocké à part
    votre meilleur score.
  hero_link: Comment ça marche →
  nav_games: Jeux
  nav_about: À propos
  language_menu: Langue
  games_heading: Les jeux
  play: Jouer
  play_title: Jouer à {title}
  shot_alt: "{title} sur un téléphone"
  iterations: itérations
  prompts: prompts
  story_link: Lire comment il a été fait →
  story_headline: Comment {title} a été fait
  nav_animations: Animations
  animations_heading: Les animations
  animations_intro:
    - >-
      Ici, pas de score ni de game over. Ce sont de petites histoires animées,
      à regarder et à écouter, nées du même principe que les jeux : une idée
      un soir, une conversation avec Claude, et beaucoup d'allers-retours sur
      ce que je vois à l'écran, jamais sur le code.
    - >-
      C'est aussi un terrain d'essai. On y trouve des styles graphiques que je
      n'avais jamais tentés, des voix générées par IA et des bruitages
      fabriqués de toutes pièces. Tout ce qu'on voit et entend est libre de
      droits ou généré, et chaque source est citée.
  watch: Regarder
  watch_title: Regarder {title}
  fullscreen: Plein écran
  watch_hint: >-
    Avec le son : l'histoire est racontée à voix haute. Sur un téléphone,
    c'est plus grand en le tournant à l'horizontale.
  runtime: "{m} min {s}"
  animation_story_link: Lire comment elle a été faite →
  # Le bouton de partage que le build ajoute à chaque jeu.
  share_button: Partager
  share_score: Partager mon score
  share_best: "Mon record à {title} : {score}."
  share_invite: "Viens jouer à {title} sur ohlala.cloud."
  share_copied: "Copié !"
  play_hint: >-
    Mieux sur un téléphone, en mode portrait. Le jeu s'ouvre en plein écran ;
    le bouton retour du navigateur ramène ici.
  feedback_heading: Ça vous a fait sourire, ou jurer ?
  feedback_body: >-
    Dites-le-moi. Dix secondes, pas besoin d'adresse e-mail, et ça arrive
    directement dans ma boîte.
  feedback_button: Donner mon avis
  more_heading: Les autres jeux
  made_by: Fait par
  with_claude: avec beaucoup d'aide de Claude.
  rss: RSS
  privacy: Confidentialité
  notfound_title: Nettoyage rayon 404
  notfound_body: "Cette page n'est pas là. Les jeux, si :"
  notfound_link: retour à la liste
