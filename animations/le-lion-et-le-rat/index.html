<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="La fable Le Lion et le Rat de Jean de La Fontaine, animée en style gravure et racontée : une expérimentation avec une voix générée par IA.">
<title>Le Lion et le Rat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&display=swap">
<style>
  /* Planche unique, volontairement mono-thème : papier vergé et encre de taille-douce */
  :root {
    color-scheme: dark;
    --ground: #17110c;
    --plate: #0e0a07;
    --ink: #241a11;
    --paper: #ecdfc3;
    --paper-soft: #cdbb95;
    --muted: #9c8763;
    --line: #4a3a28;
    --rubric: #b0442c;
    --display: 'IM Fell French Canon', 'IM Fell English', Garamond, 'Times New Roman', serif;
    --text: 'IM Fell English', Garamond, 'Times New Roman', serif;
    --sc: 'IM Fell English SC', 'IM Fell English', Garamond, serif;
  }
  [hidden] { display: none !important; }
  html, body { background: #000; margin: 0; }
  body { color: var(--paper); font-family: var(--text); padding-inline: 16px; padding-block: 20px; }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* cadre noir : l'animation posée comme une planche sur fond d'ébène */
  .plate { position: relative; background: #000; padding: clamp(10px, 2.4vw, 26px) clamp(10px, 2.4vw, 26px) clamp(6px, 1.2vw, 14px); border: 1px solid #1c1610; }
  .plate::after { content: ""; position: absolute; inset: 5px; border: 1px solid #120e0a; pointer-events: none; }

  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--paper); container-type: inline-size; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }
  #scene, .full { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .full { pointer-events: none; }
  /* décors fixes : rastérisés une fois, puis seulement déplacés par le compositeur */
  .lay { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  .tint, .grain, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .tint { background: #b8793f; opacity: .15; }
  .grain { opacity: .9; background-size: 320px 320px; }
  .vignette { background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(70,45,20,.38) 100%); }

  .caption {
    position: absolute; left: 50%; top: 4.2%; transform: translateX(-50%);
    width: min(86%, 64em); text-align: center; pointer-events: none;
    color: var(--ink); font-family: var(--text); font-style: italic;
    font-size: 2.3cqw; line-height: 1.38;
    padding: 1.1em 2.4em;
    background: radial-gradient(ellipse 60% 62% at 50% 50%, rgba(240,229,203,.94) 45%, rgba(240,229,203,0) 100%);
  }
  .caption .l { display: block; }
  .caption.moral { top: 9%; font-size: 3.4cqw; font-style: normal; font-family: var(--display); line-height: 1.25; }
  .caption.moral .l:first-child::first-letter { color: var(--rubric); }
  .caption .fin { display: block; margin-top: .9em; font-family: var(--sc); font-style: normal; font-size: .42em; letter-spacing: .3em; color: #5a4430; }

  .titlecard {
    position: absolute; left: 50%; top: 13%; transform: translateX(-50%);
    width: 70%; text-align: center; color: var(--ink); pointer-events: none;
    padding: 2.2cqw 3cqw;
    background: radial-gradient(ellipse 58% 60% at 50% 50%, rgba(240,229,203,.95) 50%, rgba(240,229,203,0) 100%);
  }
  .titlecard .eyebrow { font-family: var(--sc); letter-spacing: .32em; font-size: 1.35cqw; color: #5a4430; }
  .titlecard h2 { margin: .25em 0 .15em; font-family: var(--display); font-weight: 400; font-size: 6.4cqw; line-height: 1; }
  .titlecard h2 .cap { color: var(--rubric); }
  .titlecard h2 i { font-size: .72em; }
  .titlecard .rule { display: block; margin: .8cqw auto; width: 34%; height: 1.2cqw; }
  .titlecard .by { font-style: italic; font-size: 1.8cqw; }


  /* barre d'avancement */
  .bar { display: flex; align-items: center; gap: 10px; height: 30px; margin-top: clamp(6px, 1vw, 10px); }
  .pp { flex: none; width: 28px; height: 28px; display: grid; place-items: center; background: transparent; border: 0; padding: 0; color: #8d7a5a; cursor: pointer; }
  .pp:hover { color: var(--paper); }
  .pp svg { width: 12px; height: 12px; fill: currentColor; }
  .track { position: relative; flex: 1; height: 24px; cursor: pointer; touch-action: none; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: #2e241a; }
  .fill { position: absolute; left: 0; top: 11px; height: 2px; width: 0; background: #b9a57f; }
  .knob { position: absolute; top: 7px; width: 10px; height: 10px; margin-left: -5px; left: 0; border-radius: 50%; background: var(--paper); opacity: 0; transition: opacity .2s; }
  .track:hover .knob, .track.drag .knob, .track:focus-visible .knob { opacity: 1; }
  .track .tick { position: absolute; top: 10px; width: 2px; height: 4px; background: #4a3b2a; }
  .track:focus-visible, .pp:focus-visible { outline: 1px solid var(--rubric); outline-offset: 2px; }
  .soundchip { position: absolute; right: 3%; bottom: 5%; display: inline-flex; align-items: center; gap: .55em; font-family: var(--sc); letter-spacing: .08em; font-size: max(12px, 1.5cqw); color: var(--paper); background: rgba(20,14,9,.78); border: 1px solid rgba(236,223,195,.35); padding: .55em 1em .55em .8em; cursor: pointer; z-index: 3; transition: opacity .4s; }
  .soundchip:hover { background: rgba(20,14,9,.92); }
  .soundchip svg { width: 1.2em; height: 1.2em; fill: currentColor; }
  .soundchip:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
  .credits { margin: 2px 0 0; padding-left: 38px; font-size: 12px; color: #6d5d45; font-style: italic; letter-spacing: .02em; }
  .credits a { color: inherit; }
  .pausemark { position: absolute; left: 50%; top: 50%; width: 9cqw; height: 9cqw; margin: -4.5cqw 0 0 -4.5cqw; border-radius: 50%; background: rgba(20,14,9,.55); display: grid; place-items: center; opacity: 0; transition: opacity .35s; pointer-events: none; }
  .pausemark svg { width: 38%; height: 38%; fill: var(--paper); margin-left: 6%; }
  .stage.paused .pausemark { opacity: 1; }

  @media (max-width: 640px) {
    .caption { font-size: 3.1cqw; width: 94%; padding: .8em 1.2em; }
    .caption.moral { font-size: 4.2cqw; }
  }
</style>
</head>
<body>


<div class="wrap">
  <div class="plate">
    <div class="stage" id="stage" aria-label="Animation de la fable Le Lion et le Rat de Jean de La Fontaine, style gravure. Touchez pour mettre en pause.">
      <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true"></svg>
      <div class="tint" id="tint"></div>
      <div class="grain" id="grain"></div>
      <div class="vignette"></div>
      <div class="titlecard" id="titlecard">
        <div class="eyebrow">Fable XI · Livre second</div>
        <h2><span class="cap">L</span>e Lion <i>et</i> le Rat</h2>
        <svg class="rule" viewBox="0 0 300 12" aria-hidden="true"><path d="M0 6H120M180 6H300" stroke="#241a11" stroke-width="1"/><path d="M150 1L158 6L150 11L142 6Z" fill="#b0442c"/><circle cx="130" cy="6" r="2" fill="#241a11"/><circle cx="170" cy="6" r="2" fill="#241a11"/></svg>
        <div class="by">d'après Jean de La Fontaine</div>
      </div>
      <div class="caption" id="caption"></div>
      <button class="soundchip" id="soundchip" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6H5L9 2V14L5 10H2Z"/><path d="M11 5.5Q13 8 11 10.5M12.6 3.8Q16 8 12.6 12.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Écouter la fable</button>
      <div class="pausemark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M1 0L10 5L1 10Z"/></svg></div>
    </div>
    <div class="bar">
      <button class="pp" id="play" type="button" aria-label="Pause"></button>
      <div class="track" id="track" role="slider" tabindex="0" aria-label="Avancement du récit" aria-valuemin="0" aria-valuemax="154" aria-valuenow="0">
        <div class="fill" id="fill"></div><div class="knob" id="knob"></div>
      </div>
      <button class="pp" id="mute" type="button" aria-label="Activer le son"></button>
    </div>
    <p class="credits">Texte : Jean de La Fontaine, 1668 · Voix : Paul K., générée avec <a href="https://elevenlabs.io" target="_blank" rel="noopener">ElevenLabs</a> · Rugissement : LilMati (freesound, CC0) · Ambiances et bruitages synthétisés</p>
  </div>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
   0. CONSTANTES
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const G = 720;                 // ligne de sol du plan principal
const DUR = 154;               // durée totale du récit (s)
const LX1 = 1900;              // lion endormi (savane)
const LX2 = 3880;              // lion pris au piège (lisière)
const HOLE = 2215;             // terrier du rat
const INK = '#241a11', PAPER = '#ecdfc3', PAPER_L = '#f2e7cf', SHADE = '#d6c298', SEPIA = '#8b6b45';

/* =====================================================================
   1. UTILITAIRES
   ===================================================================== */
const f = n => Math.round(n * 10) / 10;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rad = d => d * Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

const EASE = {
  lin: x => x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  back: x => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
/* Piste d'images clés : [[t, valeur, easing du segment qui arrive], ...] -> fonction t => valeur */
function track(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];
        const u = t1 > t0 ? (t - t0) / (t1 - t0) : 1;
        return v0 + (v1 - v0) * EASE[e || 'io'](u);
      }
    }
    return keys[keys.length - 1][1];
  };
}

/* Formes « taille-douce » : traits effilés aux deux bouts, lames, contours lissés */
function lens(x0, y0, cx, cy, x1, y1, w) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L * w, ny = dx / L * w;
  return `M${f(x0)} ${f(y0)}Q${f(cx + nx)} ${f(cy + ny)} ${f(x1)} ${f(y1)}Q${f(cx - nx)} ${f(cy - ny)} ${f(x0)} ${f(y0)}Z`;
}
function blade(x0, y0, cx, cy, x1, y1, w) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  return `M${f(x0 + nx * w)} ${f(y0 + ny * w)}Q${f(cx + nx * w * .55)} ${f(cy + ny * w * .55)} ${f(x1)} ${f(y1)}Q${f(cx - nx * w * .55)} ${f(cy - ny * w * .55)} ${f(x0 - nx * w)} ${f(y0 - ny * w)}Z`;
}
function smoothClosed(p) {
  const n = p.length; let d = `M${f(p[0][0])} ${f(p[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + 'Z';
}
function blob(cx, cy, rx, ry, R, n = 26, scallop = .12) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, k = (i % 2 ? 1 - scallop : 1 + scallop * .3) + (R() - .5) * .08;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return smoothClosed(pts);
}
/* Chaîne de points -> ruban effilé (queue du lion, queue du rat) */
function ribbon(pts, w0, w1) {
  const L = [], Rr = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = lerp(w0, w1, i / (n - 1));
    L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]); Rr.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
  }
  return smoothClosed(L.concat(Rr.reverse()));
}

/* =====================================================================
   2. SVG : définitions (hachures, découpes)
   ===================================================================== */
const svg = document.getElementById('scene');
const defs = el('defs', null, svg);
function hatch(id, gap, sw, ang, color, cross) {
  const p = el('pattern', { id, width: gap, height: gap, patternUnits: 'userSpaceOnUse', patternTransform: `rotate(${ang})` }, defs);
  el('line', { x1: gap / 2, y1: 0, x2: gap / 2, y2: gap, stroke: color, 'stroke-width': sw }, p);
  if (cross) el('line', { x1: 0, y1: gap / 2, x2: gap, y2: gap / 2, stroke: color, 'stroke-width': sw * .85 }, p);
}
hatch('hL', 6, .8, 38, INK);          // ombre légère
hatch('hM', 4, .9, 38, INK);          // ombre moyenne
hatch('hD', 3.6, .85, 38, INK, true); // contre-hachure
hatch('hX', 2.8, .9, 122, INK, true); // noir profond
hatch('hH', 5, .7, 90, INK);          // horizontales (sol, ciel)
hatch('hHs', 4, .6, 90, SEPIA);       // horizontales lointaines
hatch('hV', 3.2, .8, 0, INK);         // écorce
hatch('hF', 3.2, .95, -30, INK);      // pelage

const fade = el('linearGradient', { id: 'skyFadeG', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el('stop', { offset: 0, 'stop-color': '#000' }, fade);
el('stop', { offset: .55, 'stop-color': '#444' }, fade);
el('stop', { offset: 1, 'stop-color': '#fff' }, fade);
const skyMask = el('mask', { id: 'skyMask', maskUnits: 'userSpaceOnUse', x: -3000, y: -1000, width: 6000, height: 2600 }, defs);
el('rect', { x: -3000, y: 60, width: 6000, height: 560, fill: 'url(#skyFadeG)' }, skyMask);

const above = el('clipPath', { id: 'aboveGround', clipPathUnits: 'userSpaceOnUse' }, defs);
el('rect', { x: -1000, y: -2000, width: 9000, height: 2000 + G + 1 }, above);

/* =====================================================================
   3. PLANS DE PARALLAXE
   f = facteur de vitesse (0 = fixe, 1 = plan des personnages, >1 = premier plan)
   ===================================================================== */
const stage = document.getElementById('stage');
const tintDiv = document.getElementById('tint');
const STATIC = [], DYN = [];
/* Un plan statique = un <svg> autonome, dessiné une seule fois, déplacé en CSS (GPU).
   box = zone du plan à rastériser, en coordonnées du plan. off = décalage animé (soleil, nuages). */
function staticLayer(k, box, before) {
  const s = el('svg', { viewBox: box.join(' '), class: 'lay', 'aria-hidden': 'true', preserveAspectRatio: 'none' });
  stage.insertBefore(s, before);
  STATIC.push({ el: s, k, box, off: [0, 0], q: 1 });
  return s;
}
function dynLayer(parent, k) { const g = el('g', null, parent); DYN.push({ g, k }); return g; }

const Lsky = staticLayer(.02, [-900, -50, 1900, 1000], svg);
const Lsun = staticLayer(.02, [-200, -200, 400, 400], svg);
const Lclouds = staticLayer(.08, [-900, 40, 3200, 260], svg);
const LfarHills = staticLayer(.2, [-700, 520, 2350, 480], svg);
const LnearHills = staticLayer(.4, [-560, 590, 2980, 420], svg);
const Lmid = staticLayer(.7, [-350, 330, 3960, 700], svg);
const Lstage = staticLayer(1, [-120, -30, 5220, 960], svg);
const Lbirds = dynLayer(svg, .02);
const Lactors = dynLayer(svg, 1);
const LfgTrunks = staticLayer(1.3, [3680, -20, 510, 940], tintDiv);
const front = el('svg', { viewBox: '0 0 1600 900', preserveAspectRatio: 'xMidYMid slice', class: 'full', 'aria-hidden': 'true' });
stage.insertBefore(front, tintDiv);
const Lfg = dynLayer(front, 1.3);
const nightRect = el('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#130d08', opacity: 0 }, front);
const Lcelest = dynLayer(front, .02);
// filets de la planche
el('rect', { x: 14, y: 14, width: 1572, height: 872, fill: 'none', stroke: INK, 'stroke-width': 2.4 }, front);
el('rect', { x: 22, y: 22, width: 1556, height: 856, fill: 'none', stroke: INK, 'stroke-width': .8 }, front);

let SC = 1;
function layout() {
  SC = stage.clientWidth / 1600 || 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  for (const L of STATIC) {
    const bw = L.box[2], bh = L.box[3];
    L.q = clamp(11000 / (bw * SC * dpr), .7, 1.8);    // marge de netteté pour les zooms, bornée en mémoire
    L.el.setAttribute('width', (bw * SC * L.q).toFixed(1));
    L.el.setAttribute('height', (bh * SC * L.q).toFixed(1));
  }
}
function applyCamera(cx, cy, z) {
  for (const { g, k } of DYN) {
    const zf = 1 + (z - 1) * k, cyf = 450 + (cy - 450) * k;
    g.setAttribute('transform', `translate(800 450) scale(${zf.toFixed(4)}) translate(${(-cx * k).toFixed(2)} ${(-cyf).toFixed(2)})`);
  }
  for (const L of STATIC) {
    const zf = 1 + (z - 1) * L.k, cyf = 450 + (cy - 450) * L.k;
    const px = SC * (800 + zf * (L.box[0] + L.off[0] - cx * L.k)), py = SC * (450 + zf * (L.box[1] + L.off[1] - cyf));
    L.el.style.transform = `translate3d(${px.toFixed(2)}px,${py.toFixed(2)}px,0) scale(${(zf / L.q).toFixed(5)})`;
  }
}

/* =====================================================================
   4. DÉCORS
   ===================================================================== */
const R0 = rng(1668), rr = (a, b) => a + (b - a) * R0();

/* --- Ciel --- */
el('rect', { x: -3000, y: -1000, width: 6000, height: 2600, fill: PAPER }, Lsky);
el('rect', { x: -3000, y: 60, width: 6000, height: 700, fill: 'url(#hHs)', mask: 'url(#skyMask)', opacity: .9 }, Lsky);
const sun = el('g', null, Lsun);
{
  let rays = '';
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2, r1 = 60, r2 = 60 + (i % 2 ? rr(18, 50) : rr(60, 130)); rays += `M${f(Math.cos(a) * r1)} ${f(Math.sin(a) * r1)}L${f(Math.cos(a) * r2)} ${f(Math.sin(a) * r2)}`; }
  el('path', { d: rays, stroke: INK, 'stroke-width': .7, opacity: .55 }, sun);
  el('circle', { r: 50, fill: PAPER_L, stroke: INK, 'stroke-width': 1.4 }, sun);
  el('circle', { r: 43, fill: 'none', stroke: INK, 'stroke-width': .6, 'stroke-dasharray': '2 3' }, sun);
}
const birds = [];
for (let i = 0; i < 6; i++) birds.push(el('path', { fill: 'none', stroke: INK, 'stroke-width': 1.3, 'stroke-linecap': 'round' }, Lbirds));

/* --- Nuages --- */
const cloudsG = el('g', null, Lclouds);
[[-620, 170, 180, 26], [-120, 120, 240, 30], [420, 205, 200, 24], [900, 150, 260, 32], [1400, 190, 220, 26], [1900, 140, 240, 30]].forEach(([x, y, w, h], i) => {
  const R = rng(40 + i), pts = [];
  for (let k = 0; k < 22; k++) { const a = k / 22 * Math.PI * 2, top = Math.sin(a) < 0; const bump = top ? 1 + .35 * Math.abs(Math.sin(a * 3 + i)) + R() * .15 : .75; pts.push([x + Math.cos(a) * w, y + Math.sin(a) * h * bump]); }
  const d = smoothClosed(pts);
  el('path', { d, fill: PAPER_L, stroke: INK, 'stroke-width': .9, 'stroke-opacity': .7 }, cloudsG);
  el('path', { d, fill: 'url(#hH)', 'fill-opacity': .5 }, cloudsG);
  el('path', { d: `M${x - w * .8} ${y + h * .5}Q${x} ${y + h * .95} ${x + w * .8} ${y + h * .5}Q${x} ${y + h * .5} ${x - w * .8} ${y + h * .5}Z`, fill: 'url(#hM)', 'fill-opacity': .5 }, cloudsG);
});

/* --- Collines --- */
function hillBand(parent, x0, x1, fy, fill, op, strokeC) {

const NI = 17, NJ = 8;
const netTop = (x, lift = 0) => Math.max(0, 215 * (1 - Math.pow(x / (x > 0 ? 380 : 275), 4))) + 150 * Math.exp(-Math.pow((x - 205) / 135, 2)) + 28 + lift * 40 * Math.exp(-Math.pow((x - 250) / 110, 2));

const CUT = [15, 6];

function buildNet(parent) {
  const g = el('g', { transform: `translate(${LX2} ${G})` }, parent);

  el('ellipse', { rx: 36, ry: 24, fill: PAPER_L, stroke: INK, 'stroke-width': 1.4 }, bundle);
  el('ellipse', { rx: 36, ry: 24, fill: 'url(#hX)', 'fill-opacity': .8 }, bundle);
  el('path', { d: 'M-30 -10Q0 4 30 -12M-34 4Q0 18 34 2M-10 -22L-6 22M10 -23L8 22', fill: 'none', stroke: INK, 'stroke-width': 1.6 }, bundle);

  const ropeL = el('path', { fill: 'none', stroke: '#dcc79a', 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-dasharray': '3 2.2' }, g);
  const knots = el('path', { fill: INK }, g);
  const frays = el('path', { fill: 'none', stroke: INK, 'stroke-width': 1.2, 'stroke-linecap': 'round' }, g);
  const edges = [];
  for (let i = 0; i < NI - 1; i++) {
    edges.push([i, 0, i + 1, 0]);
    for (let j = 0; j < NJ - 1; j++) { edges.push([i, j, i + 1, j + 1]); edges.push([i + 1, j, i, j + 1]); }
    edges.push([i, NJ - 1, i + 1, NJ - 1]);
  }
  const cutList = edges.filter(e => (e[0] === CUT[0] && e[1] === CUT[1]) || (e[2] === CUT[0] && e[3] === CUT[1]));
  const P = [];
  function update(s, wall) {
    bundle.setAttribute('visibility', s.drop > 0 ? 'hidden' : 'visible');
    if (s.drop <= 0) { ropeD.setAttribute('d', ''); ropeL.setAttribute('d', ''); knots.setAttribute('d', ''); frays.setAttribute('d', ''); return; }
    const e = EASE.back(clamp(s.drop, 0, 1)), fl = EASE.in(clamp(s.fall, 0, 1));
    for (let i = 0; i < NI; i++) {
      P[i] = P[i] || [];

        const u = i / (NI - 1), v = j / (NJ - 1);
        const [dx, dy] = drape(i, j, s.lift);

        let x = lerp(sx, dx, e), y = lerp(sy, dy, e);

        fr += `M${f(a[0])} ${f(a[1])}Q${f(m1[0])} ${f(m1[1] - 2)} ${f(m1[0])} ${f(m1[1] + 4)}M${f(b[0])} ${f(b[1])}Q${f(m2[0])} ${f(m2[1] - 2)} ${f(m2[0])} ${f(m2[1] + 4)}`;

  function tone(at, type, f0, f1, dur, vol, dest, vib) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    if (vib) { const l = ctx.createOscillator(); l.frequency.value = vib[0]; const lg = ctx.createGain(); lg.gain.value = vib[1]; l.connect(lg); lg.connect(o.frequency); l.start(at); l.stop(at + dur + .1); }
    o.connect(env(at, Math.min(.015, dur * .3), dur * .4, dur * .6, vol, dest)); o.start(at); o.stop(at + dur + .1);
  }
  function hiss(at, type, freq, Q, a, hold, rel, vol, dest, f1) {
    const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, at); fl.Q.value = Q;
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, at + a + hold + rel);
    s.connect(fl); fl.connect(env(at, a, hold, rel, vol, dest));
    s.start(at, R() * 1.5); s.stop(at + a + hold + rel + .05);
  }
  // ---- voix des bêtes et bruits du monde
  const S = {
    bird(at) { const p = pan(R() * 1.6 - .8, amb), n = 2 + (R() * 4 | 0), base = 2600 + R() * 2200; for (let i = 0; i < n; i++) { const t = at + i * (.09 + R() * .06); tone(t, 'sine', base * (1 + R() * .3), base * (.8 + R() * .7), .06 + R() * .06, .05, p); } },
    dove(at) { const p = pan(R() - .5, amb); tone(at, 'sine', 430, 390, .22, .07, p); tone(at + .42, 'sine', 420, 360, .6, .08, p); },
    cricket(at) { const p = pan(R() * 1.8 - .9, amb), f = 4300 + R() * 700; for (let k = 0; k < 2; k++) for (let i = 0; i < 3; i++) tone(at + k * .3 + i * .045, 'sine', f, f * .98, .028, .035, p); },
    breath(at) { hiss(at, 'lowpass', 520, .7, 1.1, .2, 1.3, .09, fx); tone(at + .3, 'sine', 58, 52, 1.6, .05, fx); },
    step(at) { tone(at, 'sine', 90, 45, .18, .12, fx); hiss(at, 'lowpass', 300, .5, .005, .02, .14, .08, fx); },
    squeak(at, n = 2, vol = .12) { for (let i = 0; i < n; i++) { const t = at + i * (.13 + R() * .06), f = 3100 + R() * 900; const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 1.35, t + .04); o.frequency.exponentialRampToValueAtTime(f * .9, t + .11); const l = ctx.createOscillator(); l.frequency.value = 52; const lg = ctx.createGain(); lg.gain.value = 180; l.connect(lg); lg.connect(o.frequency); o.connect(env(t, .01, .04, .07, vol)); o.start(t); o.stop(t + .15); l.start(t); l.stop(t + .15); } },
    scurry(at, dur) { for (let t = 0; t < dur; t += .055 + R() * .03) hiss(at + t, 'bandpass', 2400 + R() * 1500, 3, .002, .008, .02, .09 * (1 - t / dur * .5), fx); },
    scrabble(at) { for (let t = 0; t < .9; t += .04 + R() * .05) hiss(at + t, 'bandpass', 900 + R() * 900, 1.5, .003, .02, .05, .1, fx); },
    thump(at, vol = .5) { tone(at, 'sine', 80, 34, .35, vol, fx); hiss(at, 'lowpass', 260, .7, .005, .04, .3, vol * .6, fx); },
    whoosh(at, dur = 1.2, vol = .25) { hiss(at, 'bandpass', 350, 1.2, dur * .6, 0, dur * .4, vol, fx, 2200); },
    rustle(at, dur = 1.5, vol = .12) { for (let t = 0; t < dur; t += .07 + R() * .08) hiss(at + t, 'bandpass', 1200 + R() * 1400, .9, .01, .04, .09, vol * (.5 + R() * .5), fx); },
    creak(at) { const o = ctx.createOscillator(); o.type = 'sawtooth'; const f = 150 + R() * 90; o.frequency.setValueAtTime(f, at); o.frequency.linearRampToValueAtTime(f * 1.3, at + .16); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 7; o.connect(bp); bp.connect(env(at, .02, .08, .08, .06)); o.start(at); o.stop(at + .25); },
    gnaw(at) { const n = 4 + (R() * 3 | 0); for (let i = 0; i < n; i++) hiss(at + i * .065, 'bandpass', 3000 + R() * 1200, 5, .002, .006, .02, .22, fx); },
    snap(at) { hiss(at, 'highpass', 1600, .7, .002, .01, .06, .45, fx); tone(at, 'triangle', 200, 170, .45, .14, fx); },
    /* rugissement : deux dents-de-scie graves, saturées, passées dans des formants de gorge + souffle */
    roar(at, dur = 1.9, vol = .8, low = 1) {
      const out = env(at, .28, dur * .45, dur * .55, vol);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2300; lp.connect(out);
      const sum = ctx.createGain(); sum.gain.value = 1;
      [[330, 5, 1], [760, 6, .7], [1350, 8, .35]].forEach(([fq, q, g]) => { const b = ctx.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fq * low; b.Q.value = q; const gg = ctx.createGain(); gg.gain.value = g * 3; sum.connect(b); b.connect(gg); gg.connect(lp); });
      const sh = ctx.createWaveShaper(); const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; c[i] = Math.tanh(x * 4); } sh.curve = c; sh.connect(sum);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 9 + R() * 4; const lg = ctx.createGain(); lg.gain.value = 8 * low; lfo.connect(lg); lfo.start(at); lfo.stop(at + dur + .2);
      [1, 1.013].forEach(k => { const o = ctx.createOscillator(); o.type = 'sawtooth'; const fr = o.frequency; fr.setValueAtTime(70 * low * k, at); fr.linearRampToValueAtTime(140 * low * k, at + .35); fr.linearRampToValueAtTime(112 * low * k, at + dur * .6); fr.exponentialRampToValueAtTime(55 * low * k, at + dur); lg.connect(fr); const og = ctx.createGain(); og.gain.value = .5; o.connect(og); og.connect(sh); o.start(at); o.stop(at + dur + .2); });
      hiss(at, 'bandpass', 480 * low, 1, .3, dur * .4, dur * .5, vol * .35, fx);
    },
    /* vrai rugissement (LilMati, freesound, CC0) ; la synthèse ne sert que de secours */
    sample(at, rate, vol, lp) {
      const s = ctx.createBufferSource(); s.buffer = growlBuf; s.playbackRate.value = rate;
      const g = ctx.createGain(); g.gain.value = vol;
      if (lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; s.connect(f); f.connect(g); } else s.connect(g);
      g.connect(fx); s.start(at);
    },
    bigRoar(at, rate = 1, vol = 1) { if (growlBuf) S.sample(at, rate, vol); else S.roar(at, 1.9, .85 * vol); },
    growl(at, dur = 1.4, vol = .3) { if (growlBuf) S.sample(at, .78 + Math.random() * .08, vol * 1.3, 900); else S.roar(at, dur, vol, .62); }
  };
  // bruitages calés sur le récit
  const EVENTS = [
    [34.6, a => S.scrabble(a)], [37.6, a => S.squeak(a, 2, .1)], [40.8, a => S.squeak(a, 1, .07)], [43.8, a => S.squeak(a, 3, .09)],
    [49.4, a => S.growl(a, 1.3, .22)], [52.7, a => { S.thump(a, .45); S.squeak(a + .05, 4, .16); }], [55.6, a => S.growl(a, 1.6, .18)],
    [60.1, a => S.squeak(a, 2, .1)], [62.1, a => { S.scurry(a, 3.2); S.squeak(a + .2, 2, .1); }],
    [97, a => S.whoosh(a, 1.3, .28)], [98.35, a => { S.thump(a, .6); S.rustle(a, 1.6, .16); }],
    [101.05, a => S.bigRoar(a, 1, 1)], [105.25, a => S.bigRoar(a, .9, 1)],
    [110.3, a => S.scurry(a, 5.6)], [116.8, a => S.squeak(a, 2, .11)],
    [120, a => S.snap(a)], [122.4, a => S.snap(a)], [124.8, a => S.snap(a)], [127.2, a => S.snap(a)],
    [130.3, a => { S.rustle(a, 2.6, .15); S.whoosh(a + .6, 1.6, .12); }], [135.2, a => S.rustle(a, 1.5, .18)], [136.6, a => S.growl(a, 1.8, .16)],
    [141.2, a => S.squeak(a, 3, .1)], [145.6, a => S.growl(a, 2, .14)]
  ];
  const LV = {
    wind: track([[0, .05], [70, .05], [74, .015], [84, .015], [86, .035], [154, .05]]),
    heat: track([[0, 0], [8, .02], [68, .02], [72, 0], [90, 0], [95, .008], [154, .008]]),
    nightAir: track([[0, 0], [72, 0], [76, .07], [82, .07], [86, 0]]),
    leaves: track([[0, 0], [84, 0], [88, .03], [138, .03], [150, .015]]),
    birds: track([[0, 0], [3, .9], [30, .7], [46, .2], [60, .15], [70, 0], [110, 0], [115, .25], [154, .35]]),
    crickets: track([[0, 0], [71, 0], [75, 3.5], [82, 3.5], [87, .6], [92, 0]]),
    doves: track([[0, 0], [86, 0], [88, .12], [140, .08]])
  };
  const lionBreathes = t => (t > 30 && t < 48.5) || (t > 64 && t < 74);

  function stopVoice() { if (cur) { try { cur.src.stop(); } catch (_) {} cur = null; } }
  function startVoice(v, off) {
    const s = ctx.createBufferSource(); s.buffer = v.buf; const g = ctx.createGain(); g.gain.value = 1.05; s.connect(g); g.connect(master);
    s.start(ctx.currentTime + .02, v.from + off, v.len - off); cur = { v, src: s, at: ctx.currentTime + .02 - off };
    s.onended = () => { if (cur && cur.src === s) cur = null; };
  }
  function update(t, playing) {
    if (!on || !ctx) return;
    if (!playing) { if (ctx.state === 'running') ctx.suspend(); resync = true; prevT = t; return; }
    if (ctx.state === 'suspended') { ctx.resume(); }
    const now = ctx.currentTime;
    // narration
    const want = VOICE.find(v => v.buf && t >= v.t && t < v.t + v.len - .05);
    if (cur && (resync || cur.v !== want || Math.abs((now - cur.at) - (t - cur.v.t)) > .3)) stopVoice();
    if (want && !cur) startVoice(want, Math.max(0, t - want.t));
    resync = false;
    amb.gain.setTargetAtTime(cur ? .4 : .85, now, .25);
    fx.gain.setTargetAtTime(cur ? .6 : .9, now, .25);
    // lits d'ambiance
    for (const k of ['wind', 'heat', 'nightAir', 'leaves']) beds[k].gain.setTargetAtTime(LV[k](t), now, .4);
    // événements (seulement en lecture continue, jamais sur un saut)
    const dt = t - prevT;
    if (dt > 0 && dt < .5) {
      for (const [te, fn] of EVENTS) if (te > prevT && te <= t) fn(now + .01);
      if (R() < LV.birds(t) * dt) S.bird(now);
      if (R() < LV.crickets(t) * dt) S.cricket(now);
      if (R() < LV.doves(t) * dt) S.dove(now);
      if (lionBreathes(t) && Math.floor(t / 4.2) !== Math.floor(prevT / 4.2)) S.breath(now);
      if (t > 80.5 && t < 96.6) { const x0 = LION.x(prevT), x1 = LION.x(t); for (const o of [0, .25, .5, .75]) if (Math.floor(x1 / 110 + o + .38) !== Math.floor(x0 / 110 + o + .38)) S.step(now); }
      if (t > 98.6 && t < 109 && R() < 2.2 * dt) S.creak(now);
      if (t > 99 && t < 108.5 && R() < 1.2 * dt) S.rustle(now, .5, .07);
      if (t > 118.8 && t < 129.4 && Math.floor(t / .5) !== Math.floor(prevT / .5)) S.gnaw(now);
    }
    prevT = t;
  }
  return {
    get on() { return on; }, get muted() { return muted; },
    enable() { if (!ctx && !init()) return false; on = true; muted = false; master.gain.value = .95; resync = true; ctx.resume(); return true; },
    toggleMute() { muted = !muted; master.gain.setTargetAtTime(muted ? 0 : .95, ctx.currentTime, .05); },
    seeked() { resync = true; },
    update
  };
})();

/* =====================================================================
   10. LECTEUR : lecture continue, barre d'avancement, toucher = pause
   ===================================================================== */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { t: 0, playing: !reduce, wall: 0, seeking: false };
const playBtn = $('play'), bar = $('track'), fill = $('fill'), knob = $('knob');
const ICON_PAUSE = '<svg viewBox="0 0 10 10"><path d="M1 0H4V10H1ZM6 0H9V10H6Z"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 10 10"><path d="M1 0L10 5L1 10Z"/></svg>';
const ICON_AGAIN = '<svg viewBox="0 0 10 10"><path d="M5 1A4 4 0 1 1 1.2 6.2L2.6 5.8A2.6 2.6 0 1 0 5 2.4V4L2 1.7L5 -.6Z"/></svg>';
SCENES.slice(1).forEach(sc => { const tk = document.createElement('span'); tk.className = 'tick'; tk.style.left = (sc.t / DUR * 100) + '%'; bar.appendChild(tk); });

function syncPlay() {
  const end = state.t >= DUR;
  playBtn.innerHTML = state.playing ? ICON_PAUSE : (end ? ICON_AGAIN : ICON_PLAY);
  playBtn.setAttribute('aria-label', state.playing ? 'Pause' : (end ? 'Revoir' : 'Lecture'));
  stage.classList.toggle('paused', !state.playing && !end && !state.seeking);
}
function toggle() {
  if (state.t >= DUR) { state.t = 0; state.playing = true; Sound.seeked(); }
  else state.playing = !state.playing;
  syncPlay();
}
function seek(t) { state.t = clamp(t, 0, DUR); Sound.seeked(); if (state.t < DUR && playBtn.getAttribute('aria-label') === 'Revoir') syncPlay(); }
playBtn.addEventListener('click', toggle);
const muteBtn = $('mute'), chip = $('soundchip');
const ICON_SND = '<svg viewBox="0 0 16 16"><path d="M2 6H5L9 2V14L5 10H2Z"/><path d="M11 5.5Q13 8 11 10.5M12.6 3.8Q16 8 12.6 12.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 16 16"><path d="M2 6H5L9 2V14L5 10H2Z"/><path d="M11 5.5L15 10.5M15 5.5L11 10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function syncSound() {
  const live = Sound.on && !Sound.muted;
  muteBtn.innerHTML = live ? ICON_SND : ICON_MUTE;
  muteBtn.setAttribute('aria-label', live ? 'Couper le son' : 'Activer le son');
  chip.hidden = Sound.on;
}
function startSound() {
  if (!Sound.enable()) return;
  if (state.t > DUR - 1) state.t = 0;
  if (state.t < 11) state.t = 0;           // au début : on reprend du titre pour entendre toute la fable
  state.playing = true; syncPlay(); syncSound();
}
chip.addEventListener('click', e => { e.stopPropagation(); startSound(); });
muteBtn.addEventListener('click', () => { if (!Sound.on) startSound(); else { Sound.toggleMute(); syncSound(); } });
syncSound();
stage.addEventListener('click', toggle);

// barre : cliquer ou glisser pour se déplacer dans le récit
const posAt = e => { const r = bar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * DUR; };
bar.addEventListener('pointerdown', e => { state.seeking = true; bar.classList.add('drag'); try { bar.setPointerCapture(e.pointerId); } catch (_) {} seek(posAt(e)); syncPlay(); });
bar.addEventListener('pointermove', e => { if (state.seeking) seek(posAt(e)); });
const endSeek = () => { if (!state.seeking) return; state.seeking = false; bar.classList.remove('drag'); syncPlay(); };
bar.addEventListener('pointerup', endSeek); bar.addEventListener('pointercancel', endSeek);
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); seek(state.t + (e.key === 'ArrowRight' ? 5 : -5)); }
  else if (e.key === ' ' || e.key === 'k') { if (e.target === playBtn) return; e.preventDefault(); toggle(); }
});


// grain du papier (généré une fois)
(() => {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 320; const x = c.getContext('2d'); const img = x.createImageData(320, 320); const R = rng(3);
    for (let i = 0; i < img.data.length; i += 4) { const a = Math.pow(R(), 6) * 70 + R() * 14; img.data[i] = 90; img.data[i + 1] = 64; img.data[i + 2] = 36; img.data[i + 3] = a; }
    x.putImageData(img, 0, 0);
    x.globalAlpha = .06; x.strokeStyle = '#6b5030';
    for (let i = 0; i < 90; i++) { x.beginPath(); const sx = R() * 320, sy = R() * 320; x.moveTo(sx, sy); x.quadraticCurveTo(sx + R() * 30 - 15, sy + R() * 30 - 15, sx + R() * 50 - 25, sy + R() * 50 - 25); x.stroke(); }
    $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
  } catch (_) {}
})();

let last = performance.now(), uiTick = 0;
function frame(now) {
  const dt = Math.min(.25, (now - last) / 1000); last = now; state.wall += dt;
  if (state.playing && !state.seeking) { state.t += dt; if (state.t >= DUR) { state.t = DUR; state.playing = false; syncPlay(); } }
  render(state.t, state.wall);
  Sound.update(state.t, state.playing && !state.seeking);
  if (++uiTick % 2 === 0) {
    const pc = (state.t / DUR * 100).toFixed(2) + '%';
    fill.style.width = pc; knob.style.left = pc;
    bar.setAttribute('aria-valuenow', state.t.toFixed(0));
  }
  requestAnimationFrame(frame);
}
layout();
if (window.ResizeObserver) new ResizeObserver(layout).observe(stage); else window.addEventListener('resize', layout);
syncPlay();
render(0, 0);
requestAnimationFrame(frame);
})();
</script>

</body>
