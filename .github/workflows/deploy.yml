name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token to assume the AWS deploy role
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    # Only the main branch deploys; PRs just prove the build passes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # A secret, not a variable: the runner prints variables in the log,
          # and a public repo means public logs. The ARN carries the account id.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Pages, games and pictures: 5 min at the edge, invalidated on deploy,
      # so a fix shows up at once. Sound files are big and never retouched in
      # place, so browsers keep them for 30 days: to change a sound, give the
      # new file a new name (a browser that has the old one would keep it).
      # Each pass only deletes the files it covers.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" --delete \
            --exclude "*.mp3" \
            --cache-control "public, max-age=300"
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" --delete \
            --exclude "*" --include "*.mp3" \
            --cache-control "public, max-age=2592000"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
